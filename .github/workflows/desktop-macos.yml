name: Desktop macOS Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS desktop release
        run: npm run desktop:release:macos:ci

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etherana-sx-macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/mac*/**/*.app
